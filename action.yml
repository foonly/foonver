name: "Run foonver"
description: "Automate SemVer bumping and changelog management"
inputs:
  version:
    description: "Version of foonver binary to download (e.g., v0.8.1)"
    required: false
    default: "latest"
  command:
    description: "foonver command to run (auto, patch, minor, major)"
    required: false
    default: "auto"
  changelog:
    description: "Whether to update CHANGELOG.md"
    required: false
    default: "true"
  push:
    description: "Whether to push the created commit and tag"
    required: false
    default: "false"
  remote:
    description: "Git remote to push to"
    required: false
    default: "origin"
  commit_message:
    description: "Custom commit message"
    required: false
    default: ""
  commit_suffix:
    description: "Suffix to append to the commit message (e.g., [skip ci])"
    required: false
    default: ""
  version_file:
    description: "Explicitly specify the version file (e.g., config/project.json)"
    required: false
  dry_run:
    description: "Run in dry-run mode (outputs version without making changes)"
    required: false
    default: "false"
  version_sync:
    description: "Comma-separated list of files to synchronize version in"
    required: false
  prerelease:
    description: "Prerelease identifier (e.g. beta, rc) or boolean. If 'true', uses the branch name or 'beta'"
    required: false
    default: ""
  promote:
    description: "Whether to promote prerelease to stable (true, false, or auto)"
    required: false
    default: "auto"
  include_prereleases:
    description: "Whether to include prerelease versions in the changelog"
    required: false
    default: "false"
  args:
    description: "Additional raw arguments for foonver"
    required: false

outputs:
  version:
    description: "The new version string"
    value: ${{ steps.run.outputs.version }}
  is_bumped:
    description: "Whether a version bump occurred"
    value: ${{ steps.run.outputs.is_bumped }}
  is_prerelease:
    description: "Whether the resulting version is a prerelease"
    value: ${{ steps.run.outputs.is_prerelease }}
  release_notes:
    description: "The generated release notes for the latest version"
    value: ${{ steps.run.outputs.release_notes }}

runs:
  using: "composite"
  steps:
    - name: Download foonver
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "local" ] || [ "$VERSION" = "skip" ]; then
          echo "Using local foonver binary"
          if [ -f "./bin/foonver" ]; then
            cp ./bin/foonver /usr/local/bin/foonver
            chmod +x /usr/local/bin/foonver
          fi
          exit 0
        fi

        if [ "$VERSION" = "latest" ] && [ -f "./bin/foonver" ]; then
          echo "Found locally built ./bin/foonver, using it"
          cp ./bin/foonver /usr/local/bin/foonver
          chmod +x /usr/local/bin/foonver
          exit 0
        fi

        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/foonly/foonver/releases/latest/download/foonver"
        else
          URL="https://github.com/foonly/foonver/releases/download/${VERSION}/foonver"
        fi

        echo "Downloading foonver from $URL"
        curl -sSL -o /usr/local/bin/foonver "$URL"
        chmod +x /usr/local/bin/foonver

    - name: Run foonver
      id: run
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CHANGELOG: ${{ inputs.changelog }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_REMOTE: ${{ inputs.remote }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_COMMIT_SUFFIX: ${{ inputs.commit_suffix }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_VERSION_SYNC: ${{ inputs.version_sync }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_PROMOTE: ${{ inputs.promote }}
        INPUT_INCLUDE_PRERELEASES: ${{ inputs.include_prereleases }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        ARGS=()
        COMMAND="$INPUT_COMMAND"

        if [ "$INPUT_CHANGELOG" == "true" ]; then
          ARGS+=("--changelog")
        fi

        if [ "$INPUT_PUSH" == "true" ]; then
          ARGS+=("--push")
        else
          ARGS+=("--no-push")
        fi

        if [ -n "$INPUT_REMOTE" ]; then
          ARGS+=("--remote" "$INPUT_REMOTE")
        fi

        if [ -n "$INPUT_COMMIT_MESSAGE" ]; then
          ARGS+=("--commit-message" "$INPUT_COMMIT_MESSAGE")
        fi

        if [ -n "$INPUT_COMMIT_SUFFIX" ]; then
          ARGS+=("--commit-suffix" "$INPUT_COMMIT_SUFFIX")
        fi

        if [ -n "$INPUT_VERSION_FILE" ]; then
          ARGS+=("--version-file" "$INPUT_VERSION_FILE")
        fi

        if [ "$INPUT_DRY_RUN" == "true" ]; then
          ARGS+=("--dry-run")
        fi

        if [ -n "$INPUT_VERSION_SYNC" ]; then
          ARGS+=("--sync" "$INPUT_VERSION_SYNC")
        fi

        PRERELEASE="$INPUT_PRERELEASE"
        if [ "$PRERELEASE" == "true" ]; then
          REF_NAME="${GITHUB_REF_NAME:-}"
          CLEAN_TAG=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g')
          if [ -z "$CLEAN_TAG" ] || [ "$CLEAN_TAG" == "main" ] || [ "$CLEAN_TAG" == "master" ]; then
            CLEAN_TAG="beta"
          fi
          ARGS+=("--prerelease" "$CLEAN_TAG")
        elif [ -n "$PRERELEASE" ] && [ "$PRERELEASE" != "false" ]; then
          ARGS+=("--prerelease" "$PRERELEASE")
        fi

        PROMOTE="$INPUT_PROMOTE"
        if [ "$PROMOTE" == "true" ]; then
          ARGS+=("--promote")
        elif [ "$PROMOTE" == "auto" ]; then
          if [ -z "$PRERELEASE" ] || [ "$PRERELEASE" == "false" ]; then
            # Reuse the same flags the real run will use (e.g. --version-file)
            # so version discovery matches between the probe and the real run.
            CHECK_JSON=$(foonver "$COMMAND" "${ARGS[@]}" --json --dry-run 2>/dev/null || true)
            CURRENT_VER=$(echo "$CHECK_JSON" | jq -r '.current_version // empty')
            if [[ "$CURRENT_VER" =~ -[0-9A-Za-z] ]]; then
              ARGS+=("--promote")
            fi
          fi
        fi

        if [ "$INPUT_INCLUDE_PRERELEASES" == "true" ]; then
          ARGS+=("--include-prereleases")
        fi

        if [ -n "$INPUT_ARGS" ]; then
          # Split args by space, but this is a best-effort for raw args string
          read -ra EXTRA_ARGS <<< "$INPUT_ARGS"
          ARGS+=("${EXTRA_ARGS[@]}")
        fi

        # Ensure git identity is set for commits/tags
        if [ -z "$(git config user.name)" ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
        fi

        # Run foonver with --json to get structured output
        # We also use --release-notes to a temporary file to capture the delta
        TEMP_NOTES=$(mktemp)
        PLAN_JSON=$(foonver "$COMMAND" "${ARGS[@]}" --json --release-notes "$TEMP_NOTES")
        FOONVER_EXIT_CODE=$?

        if [ $FOONVER_EXIT_CODE -ne 0 ]; then
          echo "Error: foonver failed with exit code $FOONVER_EXIT_CODE"
          exit $FOONVER_EXIT_CODE
        fi

        # Use jq to extract data from the plan
        NEW_VERSION=$(echo "$PLAN_JSON" | jq -r '.next_version')
        OLD_VERSION=$(echo "$PLAN_JSON" | jq -r '.current_version')
        IS_PRERELEASE=$(echo "$PLAN_JSON" | jq -r '.is_prerelease // false')

        IS_BUMPED="false"
        if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
          IS_BUMPED="true"
        fi

        # Set outputs
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "is_bumped=$IS_BUMPED" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

        # Capture release notes as a multiline output
        if [ -f "$TEMP_NOTES" ]; then
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat "$TEMP_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          rm "$TEMP_NOTES"
        fi
